name: Coleta diaria

on:
  schedule:
    - cron: "15 6 * * *"   # todo dia 06:15 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Dias a coletar, 1-90 (use 60 no primeiro backfill)"
        default: "3"

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # necessario apenas para commitar os dados
    env:
      DAYS: ${{ github.event.inputs.days || '3' }}   # via env: evita injecao de script
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar dados brutos
        run: python src/collect.py --days "$DAYS"   # collect.py valida 1-90
      - name: Limpar
        run: python src/clean.py
      - name: Executar notebook (renderiza graficos)
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/analise.ipynb
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data notebooks
          git diff --staged --quiet || git commit -m "chore: atualiza dados $(date -u +%F)"
          git push
